<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DL Course Review Portal</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:light;
  --cr:#7B0707;--cr-dk:#5a0505;--cr-lt:#fdf2f2;--go:#F2BD2C;--go-lt:#fef9ec;--go-md:#fef3cc;
  --met-bg:#eaf3de;--met-bd:#3B6D11;--met-tx:#27500A;--nm-bg:#FCEBEB;--nm-bd:#A32D2D;--nm-tx:#791F1F;
  --na-bg:#FFF8E1;--na-bd:#B45309;--na-tx:#78350F;--bl-bg:#E8F0FB;--bl-bd:#185FA5;--bl-tx:#0F3D6E;
  --border:#d9d9d9;--bg:#fff;--bg2:#f7f7f7;--bg3:#efefef;--txt:#1a1a1a;--txt2:#555}
body{font-family:Arial,Helvetica,sans-serif;font-size:13px;color:var(--txt);background:var(--bg3);min-height:100vh}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.page{max-width:1080px;margin:0 auto;padding:16px}
.hdr{background:var(--cr);color:#fff;padding:16px 24px 12px;border-radius:10px 10px 0 0;display:flex;align-items:center;gap:14px}
.badge-tu{background:var(--go);color:var(--cr);font-weight:700;font-size:11px;padding:3px 10px;border-radius:4px;letter-spacing:.4px;white-space:nowrap}
.hdr h1{font-family:Garamond,'EB Garamond',Georgia,serif;font-size:20px;font-weight:600}
.hdr p{font-size:11px;color:rgba(255,255,255,.78);margin-top:2px}
.gold{height:4px;background:var(--go)}
.card{background:var(--bg);border:1px solid var(--border);border-top:none;border-radius:0 0 10px 10px;min-height:260px}
.pad{padding:16px 20px}
h2{font-size:15px;font-weight:700;margin-bottom:4px}
.muted{color:var(--txt2)}.small{font-size:11px}
/* buttons */
.btn{border:1px solid var(--border);background:var(--bg);border-radius:6px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--bg2)}
.btn.p{background:var(--cr);border-color:var(--cr);color:#fff}.btn.p:hover{background:var(--cr-dk)}
.btn.g{background:var(--met-bd);border-color:var(--met-bd);color:#fff}
.btn.o{border-color:var(--cr);color:var(--cr)}
.btn.sm{padding:4px 10px;font-size:11px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.cardc:focus-visible{outline:2px solid var(--bl-bd);outline-offset:1px}
input[type=text],input[type=password],input[type=date],input[type=number],input[type=search],select,textarea{border:1px solid var(--border);border-radius:6px;padding:6px 9px;background:var(--bg)}
label.f{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--txt2);margin-bottom:3px}
/* login */
.login{padding:32px 28px;max-width:420px;margin:0 auto}
.login .row{margin-bottom:14px}.login select,.login input{width:100%;padding:9px 12px}
.login input[type=password],.login input.pin{letter-spacing:6px;font-size:18px;font-weight:700;text-align:center}
.note{padding:10px 14px;border-radius:6px;font-size:12px;line-height:1.6;margin-top:12px}
.note.err{background:var(--nm-bg);border:1px solid var(--nm-bd);color:var(--nm-tx)}
.note.info{background:var(--go-md);border:1px solid var(--go);color:#5a3e00}
.note.ok{background:var(--met-bg);border:1px solid var(--met-bd);color:var(--met-tx)}
.note.blue{background:var(--bl-bg);border:1px solid var(--bl-bd);color:var(--bl-tx)}
/* session bar */
.sbar{display:flex;align-items:center;gap:10px;padding:10px 20px;background:var(--bg2);border-bottom:1px solid var(--border);flex-wrap:wrap}
.av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0;background:var(--cr)}
.sbar .who{font-weight:700}.sbar .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chipsave{font-size:11px;font-weight:600;padding:3px 10px;border-radius:12px;background:var(--met-bg);color:var(--met-tx)}
.chipsave.saving{background:var(--go-md);color:#7a5a00}.chipsave.error{background:var(--nm-bg);color:var(--nm-tx)}
/* stage */
.stg{display:inline-block;font-size:10px;font-weight:700;padding:2px 9px;border-radius:10px;white-space:nowrap}
.stg.s0{background:#e9e9e9;color:#444}.stg.s1{background:var(--go-md);color:#7a5a00}
.stg.s2{background:var(--nm-bg);color:var(--nm-tx)}.stg.s3{background:var(--bl-bg);color:var(--bl-tx)}
.stg.s4{background:var(--met-bg);color:var(--met-tx)}
.pipe{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:14px 20px 6px}
.pipe button{border:1px solid var(--border);background:var(--bg);border-radius:8px;padding:9px 10px;text-align:left;cursor:pointer}
.pipe button.on{border-color:var(--cr);box-shadow:0 0 0 2px rgba(123,7,7,.18)}
.pipe .n{font-size:22px;font-weight:700;line-height:1.1}.pipe .l{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--txt2)}
.rvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;padding:8px 20px}
.rvc{border:1px solid var(--border);border-radius:8px;padding:9px 12px;background:var(--bg);cursor:pointer;text-align:left}
.rvc.on{border-color:var(--cr);box-shadow:0 0 0 2px rgba(123,7,7,.18)}
.rvc .nm{font-weight:700;font-size:12px}.rvc .bar{height:5px;background:var(--bg3);border-radius:3px;overflow:hidden;margin:6px 0 5px}
.rvc .bar i{display:block;height:100%;background:var(--met-bd)}
.filters{display:flex;gap:8px;padding:8px 20px 4px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:9px;padding:10px 20px 20px}
.cardc{border:1px solid var(--border);border-left:4px solid #bbb;border-radius:8px;padding:10px 12px;cursor:pointer;background:var(--bg);text-align:left;display:block;width:100%}
.cardc:hover{box-shadow:0 2px 8px rgba(0,0,0,.12)}
.cardc.s1{border-left-color:var(--go)}.cardc.s2{border-left-color:var(--nm-bd)}.cardc.s3{border-left-color:var(--bl-bd)}.cardc.s4{border-left-color:var(--met-bd)}
.cardc .cn{font-weight:700;font-size:12px}.cardc .ct,.cardc .ci{font-size:11px;color:var(--txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cardc .meta{font-size:10px;color:var(--txt2);margin:4px 0 6px}
.cardc .st{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:10px}
.pri1{color:var(--nm-tx);font-weight:700}.pri3{color:var(--met-tx);font-weight:700}
.over{color:var(--nm-tx);font-weight:700}
.empty{padding:36px 20px;text-align:center;color:var(--txt2)}
/* review */
.pills{display:flex;flex-wrap:wrap;gap:6px;padding:9px 20px;background:var(--go-lt);border-bottom:1px solid #e8d48a;align-items:center}
.pill{font-size:11px;background:#fff;border:1px solid #d9c46a;color:#5a3e00;padding:3px 9px;border-radius:12px}
.pill.warn{background:#FFF3CD;border-color:#856404;color:#533f03;font-weight:700}
.sec{font-size:11px;font-weight:700;color:var(--cr);text-transform:uppercase;letter-spacing:.7px;padding:16px 0 6px;border-bottom:2px solid var(--go);margin-bottom:8px}
.secnote{font-size:11px;color:#5a3e00;background:var(--go-lt);border-radius:4px;padding:6px 9px;margin-bottom:8px}
.ri{border:1px solid var(--border);border-radius:8px;margin-bottom:8px;overflow:hidden}
.ri.need{border-color:#E24B4A}
.ri.met{border-color:var(--met-bd)}.ri.nm{border-color:var(--nm-bd)}.ri.na{border-color:var(--na-bd)}
.rih{display:flex;align-items:flex-start;gap:10px;padding:11px 14px}
.ri.met .rih{background:var(--met-bg)}.ri.nm .rih{background:var(--nm-bg)}.ri.na .rih{background:var(--na-bg)}
.num{min-width:22px;height:22px;border-radius:50%;background:var(--cr);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ri.met .num{background:var(--met-bd)}.ri.nm .num{background:var(--nm-bd)}.ri.na .num{background:var(--na-bd)}
.rtx{flex:1;font-size:12px;line-height:1.5;min-width:0}.rtx b{font-weight:700}.rtx .g{font-size:11px;color:var(--txt2);margin-top:2px}
.syl{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}.syl div{flex:1;min-width:140px}.syl input{width:100%;font-size:11px}
.rg{display:flex;gap:6px;flex-shrink:0}
.rg label{position:relative;display:flex;align-items:center;gap:4px;padding:6px 12px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-size:11px;font-weight:700;color:var(--txt2);cursor:pointer;white-space:nowrap}
.rg input{position:absolute;opacity:0;inset:0;cursor:pointer}
.rg label:has(input:focus-visible){outline:2px solid var(--bl-bd);outline-offset:1px}
.rg label.met:has(input:checked){background:var(--met-bd);border-color:var(--met-bd);color:#fff}
.rg label.nm:has(input:checked){background:var(--nm-bd);border-color:var(--nm-bd);color:#fff}
.rg label.na:has(input:checked){background:var(--na-bd);border-color:var(--na-bd);color:#fff}
.fb{padding:8px 14px 10px;background:var(--bg2);border-top:1px solid var(--border)}
.fb textarea{width:100%;min-height:54px;resize:vertical;line-height:1.5;font-size:12px}
.rated{font-size:10px;font-weight:700;padding:3px 10px;border-radius:10px;white-space:nowrap}
.rated.met{background:var(--met-bd);color:#fff}.rated.nm{background:var(--nm-bd);color:#fff}.rated.na{background:var(--na-bd);color:#fff}
.sum{display:flex;gap:8px;padding:10px 20px;background:var(--bg2);border-top:1px solid var(--border);flex-wrap:wrap;align-items:center;position:sticky;bottom:0}
.chip{padding:4px 11px;border-radius:20px;font-size:11px;font-weight:600}
.chip.met{background:var(--met-bg);color:var(--met-tx)}.chip.nm{background:var(--nm-bg);color:var(--nm-tx)}
.chip.na{background:var(--na-bg);color:var(--na-tx)}.chip.pe{background:var(--go-md);color:#7a5a00}
.panel{margin:14px 20px;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.panel>h3{font-size:12px;font-weight:700;padding:9px 14px;background:var(--bg2);border-bottom:1px solid var(--border)}
.panel .body{padding:12px 14px}
.rem{border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.rem.done{background:var(--met-bg);border-color:var(--met-bd)}
.rem .top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.rem textarea{width:100%;min-height:38px;margin-top:6px;font-size:12px}
.rem .acts{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;align-items:center}
.supbar{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
/* import */
.maps{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin:10px 0}
.maps select{width:100%}
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:8px;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:11px}
th{background:var(--cr);color:#fff;text-align:left;padding:6px 8px;white-space:nowrap}
td{padding:5px 8px;border-top:1px solid var(--border);vertical-align:top}
tr.exists td{background:var(--bg2);color:var(--txt2)}
tr.chg td{background:#FFF8E1}tr.chg td:first-child{box-shadow:inset 3px 0 0 var(--go)}
td select{font-size:11px;padding:3px 6px;max-width:170px}
.ruledesc{font-size:11px;color:var(--txt2);margin-top:8px;line-height:1.5}
td.w{color:var(--nm-tx)}
/* modal + toast */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:10px;padding:22px 26px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
.modal .fr{margin-bottom:10px}.modal .fr input{width:100%}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:20px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:60;max-width:90vw}
#toast.show{opacity:1}
@media(max-width:720px){.pipe{grid-template-columns:repeat(2,1fr)}.rih{flex-wrap:wrap}.rg{width:100%}}
</style>
</head>
<body>
<div class="page">
  <div class="hdr">
    <div class="badge-tu" id="hdr-inst">TUSKEGEE UNIVERSITY</div>
    <div><h1>DL Course Review Portal</h1><p id="hdr-sub">&nbsp;</p></div>
  </div>
  <div class="gold"></div>
  <main class="card" id="app"></main>
</div>
<div id="toast" role="status"></div>
<div id="modal"></div>

<script>
/* ════════════════════════════════════════════════════════════════════════════
   THE ONLY LINE YOU EVER EDIT: paste the Web app URL from your Apps Script
   deployment between the quotes. Courses, reviewers, PINs, the rubric and the
   term all live in the Google Sheet, so this file never changes between terms.
   ════════════════════════════════════════════════════════════════════════════ */
const SCRIPT_URL = 'PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE';

// ── helpers ──────────────────────────────────────────────────────────────────
const $ = s => document.querySelector(s);
const app = () => $('#app');
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const STAGES = ['Assigned', 'In Review', 'Action Required', 'Revisions In Progress', 'Certified'];
const RLABEL = { met: 'Met', nm: 'Not Met', na: 'N/A' };
function toast(msg, ms = 3000) { const t = $('#toast'); t.textContent = msg; t.className = 'show'; clearTimeout(t._t); t._t = setTimeout(() => t.className = '', ms); }
function initials(n) { return n.replace(/^Dr\.?\s*/i, '').split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase() || '?'; }
function colorFor(n) { const p = ['#185FA5', '#553C9A', '#854F0B', '#0F6E6E', '#8A2D6B', '#3B6D11']; let h = 0; for (const ch of n) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return p[h % p.length]; }

// ── state ────────────────────────────────────────────────────────────────────
const S = { token: '', user: null, settings: {}, term: '', terms: [], rubric: [], courses: [], rv: {}, rem: {}, reviewers: [], certifiedBefore: [],
            f: { stage: '', reviewer: '', program: '', q: '' }, view: 'dash', cur: '', save: 'saved' };
const isSup = () => S.user && S.user.role === 'Supervisor';
const courseById = id => S.courses.find(c => c['Course ID'] === id);
const mine = c => isSup() || c.Reviewer === S.user.name;
const submitted = c => !!c['Review Date'];
const canEdit = c => mine(c) && !submitted(c);
function item(c, id) { const m = S.rv[c['Course ID']] || (S.rv[c['Course ID']] = {}); return m[id] || (m[id] = { rating: '', feedback: '', sylTerm: '', sylDate: '' }); }
function counts(c) { const k = { met: 0, nm: 0, na: 0, pend: 0 }; S.rubric.forEach(r => { const v = item(c, r.id).rating; k[v || 'pend']++; }); return k; }
function stageOf(c) { if (submitted(c)) return c.Stage || 'Action Required'; return counts(c).pend < S.rubric.length ? 'In Review' : 'Assigned'; }
const remOf = c => S.rem[c['Course ID']] || [];
const openItems = c => remOf(c).filter(m => m.Status !== 'Completed');
const overdue = c => submitted(c) && stageOf(c) !== 'Certified' ? openItems(c).filter(m => m['Due Date'] && m['Due Date'] < today()) : [];
const priLabel = p => ({ P1: 'P1 — review first', P2: 'P2', P3: 'P3 — review last' })[p] || p;
// Priority rule: brand-new courses first, then previously reviewed Term 1 courses, then previously reviewed Term 2 courses.
// P numbers follow that order among the groups present, so with no new courses Term 1 is P1.
const isNewCourse = c => /\bnew\b/i.test(c['Course Status'] || '');
const priTier = c => isNewCourse(c) ? 0 : (!c.Session || /term\s*1\b/i.test(c.Session)) ? 1 : 2;
const priReason = c => isNewCourse(c) ? 'New course' : 'Previously reviewed, ' + (c.Session || 'full term');
function rulePriorities(list) { const present = [0, 1, 2].filter(t => list.some(c => priTier(c) === t)); return list.map(c => 'P' + (present.indexOf(priTier(c)) + 1)); }
const PRI_RULE_TEXT = 'New courses first, then previously reviewed Term 1 courses, then previously reviewed Term 2 courses. The numbers follow that order among the groups present, so with no new courses Term 1 is P1. Courses with no session are treated as starting with Term 1. A course is new when its course status says "New".';
const priOptions = sel => ['P1', 'P2', 'P3'].map(p => `<option${sel === p ? ' selected' : ''}>${p}</option>`).join('');

// ── server calls ─────────────────────────────────────────────────────────────
async function api(action, payload = {}) {
  let res;
  try {
    res = await fetch(SCRIPT_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                                    body: JSON.stringify(Object.assign({ action, token: S.token }, payload)) });
  } catch (e) { throw new Error('Could not reach the review database. Check your connection and try again.'); }
  let j; try { j = await res.json(); } catch (e) { throw new Error('The review database returned an unexpected reply. Confirm the Apps Script deployment is set to "Anyone".'); }
  if (!j.ok) {
    if (j.error === 'AUTH') { signOut(true); throw new Error('Your session has ended. Please sign in again.'); }
    throw new Error(j.error);
  }
  return j.data;
}

// ── outbox: ratings are saved to the Sheet as the reviewer works ─────────────
const OB = { q: {}, busy: false, pending: null, timer: null, seq: 0,
  key() { return 'dlrp_outbox_' + S.user.name; },
  load() { try { this.q = JSON.parse(localStorage.getItem(this.key()) || '{}'); } catch (e) { this.q = {}; } },
  persist() { try { localStorage.setItem(this.key(), JSON.stringify(this.q)); } catch (e) {} },
  size() { return Object.keys(this.q).length; },
  put(courseId, itemId) {
    const v = S.rv[courseId][itemId];
    this.q[courseId + '\u0001' + itemId] = { courseId, itemId, rating: v.rating, feedback: v.feedback, sylTerm: v.sylTerm, sylDate: v.sylDate, n: ++this.seq };
    this.persist(); setSave('saving'); clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 900);
  },
  flush() {
    clearTimeout(this.timer);
    if (this.busy) return this.pending.then(() => this.size() ? this.flush() : true);
    if (!this.size()) { setSave('saved'); return Promise.resolve(true); }
    this.busy = true; setSave('saving');
    const snap = Object.values(this.q);
    this.pending = (async () => {
      try {
        const r = await api('saveBatch', { ops: snap.map(o => ({ courseId: o.courseId, itemId: o.itemId, rating: o.rating, feedback: o.feedback, sylTerm: o.sylTerm, sylDate: o.sylDate })) });
        snap.forEach(o => { const k = o.courseId + '\u0001' + o.itemId; if (this.q[k] && this.q[k].n === o.n) delete this.q[k]; });
        this.persist(); this.busy = false;
        if (r.rejected.length) toast(r.rejected.length + ' change(s) were not saved: ' + r.rejected[0].reason + '.', 6000);
        if (this.size()) return this.flush();
        setSave('saved'); return true;
      } catch (e) {
        this.busy = false; setSave('error');
        if (S.token) this.timer = setTimeout(() => this.flush(), 8000);
        return false;
      }
    })();
    return this.pending;
  },
  applyToState() {
    Object.keys(this.q).forEach(k => {
      const o = this.q[k], c = courseById(o.courseId);
      if (!c || submitted(c)) { delete this.q[k]; return; }
      o.n = ++this.seq; Object.assign(item(c, o.itemId), { rating: o.rating, feedback: o.feedback, sylTerm: o.sylTerm, sylDate: o.sylDate });
    });
    this.persist();
  }
};
function setSave(state) {
  S.save = state; const el = $('#save-chip'); if (!el) return;
  el.className = 'chipsave' + (state === 'saved' ? '' : ' ' + state);
  el.textContent = state === 'saved' ? 'All changes saved' : state === 'saving' ? 'Saving…' : 'Not saved — retrying';
}
const saveChip = () => `<span id="save-chip" class="chipsave${S.save === 'saved' ? '' : ' ' + S.save}">${S.save === 'saved' ? 'All changes saved' : S.save === 'saving' ? 'Saving…' : 'Not saved — retrying'}</span>`;
window.addEventListener('beforeunload', e => { if (OB.size()) { e.preventDefault(); e.returnValue = ''; } });

// ── sign-in ──────────────────────────────────────────────────────────────────
async function boot() {
  if (/PASTE_YOUR/.test(SCRIPT_URL)) {
    app().innerHTML = `<div class="login"><h2>Setup required</h2><div class="note info">This portal is not yet connected to its Google Sheet. Open <b>index.html</b>, find <b>SCRIPT_URL</b> near the bottom of the file, and paste the Web app URL from your Apps Script deployment.</div></div>`;
    return;
  }
  const saved = sessionStorage.getItem('dlrp_token');
  if (saved) { S.token = saved; try { await load(); return; } catch (e) { S.token = ''; sessionStorage.removeItem('dlrp_token'); } }
  showLogin();
}
async function showLogin(msg) {
  S.view = 'login';
  app().innerHTML = `<div class="login"><h2>Reviewer Sign-In</h2><p class="muted" style="margin-bottom:18px">Loading…</p></div>`;
  let info;
  try { info = await api('names'); } catch (e) { app().innerHTML = `<div class="login"><h2>Reviewer Sign-In</h2><div class="note err">${esc(e.message)}</div><p style="margin-top:12px"><button class="btn" data-act="retryLogin">Try again</button></p></div>`; return; }
  setHeader(info.institution, info.office, info.term);
  app().innerHTML = `<div class="login">
    <h2>Reviewer Sign-In</h2>
    <p class="muted" style="margin-bottom:18px">Select your name and enter your 4-digit PIN.</p>
    <form id="login-form">
      <div class="row"><label class="f" for="lg-name">Name</label>
        <select id="lg-name" required><option value="">— Select your name —</option>${info.names.map(n => `<option>${esc(n)}</option>`).join('')}</select></div>
      <div class="row"><label class="f" for="lg-pin">PIN</label>
        <input id="lg-pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="••••" required></div>
      <button class="btn p" style="width:100%;padding:11px" id="lg-go">Sign in</button>
    </form>
    <div id="lg-err">${msg ? `<div class="note err">${esc(msg)}</div>` : ''}</div>
    <div class="note info">Your PIN is provided individually by your supervisor. Your work is saved to the review database as you go, so you can continue from any computer.</div>
  </div>`;
  $('#login-form').addEventListener('submit', async e => {
    e.preventDefault(); const b = $('#lg-go'); b.disabled = true; b.textContent = 'Signing in…';
    try {
      const r = await api('login', { name: $('#lg-name').value, pin: $('#lg-pin').value.trim() });
      S.token = r.token; sessionStorage.setItem('dlrp_token', r.token); await load();
    } catch (err) { if ($('#lg-err')) { $('#lg-err').innerHTML = `<div class="note err">${esc(err.message)}</div>`; b.disabled = false; b.textContent = 'Sign in'; } }
  });
}
function signOut(silent) {
  S.token = ''; S.user = null; sessionStorage.removeItem('dlrp_token'); clearTimeout(OB.timer);
  if (!silent) showLogin(); else setTimeout(() => showLogin('Your session has ended. Please sign in again.'), 0);
}
function setHeader(inst, office, term) {
  if (inst) $('#hdr-inst').textContent = inst.toUpperCase();
  $('#hdr-sub').textContent = [office, term].filter(Boolean).join(' · ') || ' ';
}
async function load(term) {
  const d = await api('bootstrap', term ? { term } : {});
  Object.assign(S, { user: d.user, settings: d.settings, term: d.term, terms: d.terms, rubric: d.rubric, courses: d.courses, reviewers: d.reviewers || [], certifiedBefore: d.certifiedBefore || [], rv: {}, rem: {} });
  d.reviews.forEach(r => { (S.rv[r['Course ID']] = S.rv[r['Course ID']] || {})[r['Item ID']] = { rating: r.Rating, feedback: r.Feedback, sylTerm: r['Syllabus Term'], sylDate: r['Syllabus Updated'] }; });
  d.remediation.forEach(m => (S.rem[m['Course ID']] = S.rem[m['Course ID']] || []).push(m));
  setHeader(S.settings['Institution'], S.settings['Office Name'], S.term);
  OB.load(); OB.applyToState(); if (OB.size()) OB.flush();
  if (S.view === 'review' && courseById(S.cur)) renderReview(); else renderDash();
}
function merge(reply) {
  const i = S.courses.findIndex(c => c['Course ID'] === reply.course['Course ID']);
  if (i >= 0) S.courses[i] = reply.course;
  S.rem[reply.course['Course ID']] = reply.remediation;
}

// ── dashboard ────────────────────────────────────────────────────────────────
function visibleCourses() {
  const f = S.f, q = f.q.trim().toLowerCase();
  return S.courses.filter(c =>
    (!f.stage || stageOf(c) === f.stage) &&
    (!f.reviewer || (f.reviewer === '(unassigned)' ? !c.Reviewer : c.Reviewer === f.reviewer)) &&
    (!f.program || c.Program === f.program) &&
    (!q || [c['Course Number'], c['Course Title'], c.Instructor].join(' ').toLowerCase().includes(q))
  ).sort((a, b) => (a.Priority || 'P2').localeCompare(b.Priority || 'P2') || a['Course Number'].localeCompare(b['Course Number']) || (a.Session || '').localeCompare(b.Session || ''));
}
function sbar(inner) {
  return `<div class="sbar"><div class="av" style="background:${colorFor(S.user.name)}">${esc(initials(S.user.name))}</div>
    <div><div class="who">${esc(S.user.name)}</div><div class="small muted">${isSup() ? 'Supervisor' : 'Reviewer'}</div></div>
    <div class="right">${inner}</div></div>`;
}
function renderDash() {
  S.view = 'dash'; S.cur = '';
  const sup = isSup(), all = S.courses, byStage = {}; STAGES.forEach(s => byStage[s] = 0); all.forEach(c => byStage[stageOf(c)]++);
  const od = all.reduce((n, c) => n + overdue(c).length, 0);
  const termSel = sup && S.terms.length > 1
    ? `<select data-ch="term" aria-label="Term">${S.terms.map(t => `<option${t === S.term ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select>`
    : `<b>${esc(S.term)}</b>`;
  let h = sbar(`${termSel} ${saveChip()}
    ${sup ? `<button class="btn p sm" data-act="import">Import courses</button><button class="btn sm" data-act="assign" ${all.length ? '' : 'disabled'}>Assignments &amp; priority</button><button class="btn sm" data-act="settings">Settings</button>` : ''}
    <button class="btn sm" data-act="exportXlsx" ${all.length ? '' : 'disabled'}>Export Excel</button>
    <button class="btn sm" data-act="exportAllPdf" ${all.some(submitted) ? '' : 'disabled'}>Export PDFs</button>
    <button class="btn sm" data-act="refresh">Refresh</button><button class="btn sm" data-act="signOut">Sign out</button>`);

  const noPin = S.reviewers.filter(r => r.active && !r.hasPin);
  const unassigned = all.filter(c => !c.Reviewer).length;
  if (sup && unassigned) h += `<div class="pad" style="padding-bottom:0"><div class="note info" style="margin-top:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap">${unassigned} course${unassigned > 1 ? 's have' : ' has'} no reviewer. <button class="btn p sm" data-act="assign">Assign reviewers</button></div></div>`;
  if (sup && noPin.length) h += `<div class="pad" style="padding-bottom:0"><div class="note err" style="margin-top:0">No PIN is set for ${noPin.map(r => esc(r.name)).join(', ')}. Type a 4-digit PIN in the Reviewers tab of the Sheet; until then they cannot sign in.</div></div>`;
  const due = S.settings['Review Due Date'];
  if (due && byStage['Assigned'] + byStage['In Review'] > 0) h += `<div class="pad" style="padding-bottom:0"><div class="note ${due < today() ? 'err' : 'info'}" style="margin-top:0">Reviews are due <b>${esc(due)}</b>. ${byStage['Assigned'] + byStage['In Review']} still to be submitted.</div></div>`;

  if (!all.length) {
    h += `<div class="empty"><h2>No courses for ${esc(S.term)} yet</h2><p style="margin-top:6px">${sup ? 'Import a course list to assign reviewers and begin the cycle.' : 'No courses are assigned to you for this term.'}</p>
      ${sup ? '<p style="margin-top:14px"><button class="btn p" data-act="import">Import courses</button></p>' : ''}</div>`;
    app().innerHTML = h; return;
  }
  h += `<div class="pipe">${STAGES.map((s, i) => `<button data-act="fStage" data-v="${esc(s)}" class="${S.f.stage === s ? 'on' : ''}" aria-pressed="${S.f.stage === s}">
      <div class="n">${byStage[s]}</div><div class="l">${esc(s)}</div></button>`).join('')}</div>`;
  if (od) h += `<div class="pad" style="padding-top:4px;padding-bottom:0"><span class="over">${od} remediation item${od > 1 ? 's are' : ' is'} past due.</span></div>`;

  if (sup) {
    const names = S.reviewers.filter(r => all.some(c => c.Reviewer === r.name) || (r.active && r.role === 'Reviewer')).map(r => r.name);
    if (all.some(c => !c.Reviewer)) names.push('(unassigned)');
    h += `<div class="rvgrid">${names.map(n => {
      const cs = all.filter(c => n === '(unassigned)' ? !c.Reviewer : c.Reviewer === n);
      const sub = cs.filter(submitted).length, cert = cs.filter(c => stageOf(c) === 'Certified').length, op = cs.reduce((k, c) => k + (submitted(c) ? openItems(c).length : 0), 0);
      return `<button class="rvc ${S.f.reviewer === n ? 'on' : ''}" data-act="fReviewer" data-v="${esc(n)}" aria-pressed="${S.f.reviewer === n}">
        <div class="nm" style="color:${n === '(unassigned)' ? 'var(--nm-tx)' : colorFor(n)}">${n === '(unassigned)' ? 'Unassigned' : esc(n)}</div>
        <div class="bar"><i style="width:${cs.length ? Math.round(cert / cs.length * 100) : 0}%"></i></div>
        <div class="small muted">${cs.length} assigned · ${sub} reviewed · ${cert} certified${op ? ` · ${op} open item${op > 1 ? 's' : ''}` : ''}</div></button>`;
    }).join('')}</div>`;
  }
  const progs = [...new Set(all.map(c => c.Program).filter(Boolean))].sort();
  h += `<div class="filters"><input type="search" placeholder="Search course or instructor" value="${esc(S.f.q)}" data-in="fq" aria-label="Search" style="min-width:220px">
    ${progs.length > 1 ? `<select data-ch="fProgram" aria-label="Program"><option value="">All programs</option>${progs.map(p => `<option${S.f.program === p ? ' selected' : ''}>${esc(p)}</option>`).join('')}</select>` : ''}
    ${S.f.stage || S.f.reviewer || S.f.program || S.f.q ? `<button class="btn sm" data-act="fClear">Clear filters</button>` : ''}
    <span class="small muted" id="shown"></span></div><div class="grid" id="grid"></div>`;
  app().innerHTML = h; renderGrid();
}
function renderGrid() {
  const list = visibleCourses(), g = $('#grid'); if (!g) return;
  $('#shown').textContent = list.length + ' of ' + S.courses.length + ' courses';
  g.innerHTML = list.length ? list.map(c => {
    const st = stageOf(c), si = STAGES.indexOf(st), k = counts(c), op = openItems(c), od = overdue(c);
    let line = '';
    if (st === 'In Review') line = `${S.rubric.length - k.pend}/${S.rubric.length} rated`;
    else if (submitted(c) && st !== 'Certified') line = `${op.length} open item${op.length === 1 ? '' : 's'}` + (od.length ? ` · <span class="over">${od.length} past due</span>` : '');
    else if (st === 'Certified' && c.Override === 'APPROVED') line = 'Supervisor override';
    return `<button class="cardc s${si}" data-act="open" data-id="${esc(c['Course ID'])}">
      <div class="cn">${esc(c['Course Number'])}${c.Flag ? ' <span class="over" title="Flagged for follow-up">⚑</span>' : ''}</div>
      ${c['Course Title'] ? `<div class="ct">${esc(c['Course Title'])}</div>` : ''}<div class="ci">${esc(c.Instructor)}</div>
      <div class="meta"><span class="${c.Priority === 'P1' ? 'pri1' : c.Priority === 'P3' ? 'pri3' : ''}">${esc(c.Priority || 'P2')}</span>${c.Session ? ' · ' + esc(c.Session) : ''}${c.Program ? ' · ' + esc(c.Program) : ''}${isSup() ? ' · <b style="color:' + (c.Reviewer ? colorFor(c.Reviewer) : 'var(--nm-tx)') + '">' + esc(c.Reviewer || 'Unassigned') + '</b>' : ''}</div>
      <div class="st"><span class="stg s${si}">${esc(st)}</span><span>${line}</span></div></button>`;
  }).join('') : `<div class="empty" style="grid-column:1/-1">No courses match these filters.</div>`;
}

// ── review screen ────────────────────────────────────────────────────────────
function sections() { const out = []; S.rubric.forEach((r, i) => { let s = out[out.length - 1]; if (!s || s.name !== r.section) out.push(s = { name: r.section, note: r.sectionNote, items: [] }); s.items.push({ r, n: i + 1 }); }); return out; }
function renderReview() {
  const c = courseById(S.cur); if (!c) return renderDash();
  S.view = 'review';
  const edit = canEdit(c), st = stageOf(c), si = STAGES.indexOf(st), k = counts(c), sup = isSup(), list = visibleCourses(), pos = list.indexOf(c);
  let h = `<div class="sbar"><button class="btn sm o" data-act="back">← All courses</button>
    <div><div class="who">${esc(c['Course Number'])}${c['Course Title'] ? ' — ' + esc(c['Course Title']) : ''}</div><div class="small muted">${esc(c.Instructor)}</div></div>
    <div class="right">${saveChip()}
      ${pos > 0 ? `<button class="btn sm" data-act="open" data-id="${esc(list[pos - 1]['Course ID'])}">← Prev</button>` : ''}
      ${pos >= 0 && pos < list.length - 1 ? `<button class="btn sm" data-act="open" data-id="${esc(list[pos + 1]['Course ID'])}">Next →</button>` : ''}</div></div>
  <div class="pills"><span class="stg s${si}">${esc(st)}</span>
    ${[c.Program, c.College, c.Credits, c.Session, c['Course Status'], 'Priority ' + (c.Priority || 'P2') + ' · ' + priReason(c), c.Reviewer ? 'Reviewer: ' + c.Reviewer : 'Unassigned'].filter(Boolean).map(x => `<span class="pill">${esc(x)}</span>`).join('')}
    ${c.Flag ? '<span class="pill warn">⚑ Flagged for follow-up</span>' : ''}${c.Override ? `<span class="pill warn">Supervisor override: ${esc(c.Override)}</span>` : ''}
    ${c['Pre-Flags'] ? `<span class="pill warn">Instructor self-report — not confirmed: ${esc(c['Pre-Flags'])}</span>` : ''}</div>`;

  if (submitted(c)) h += outcomePanel(c);
  if (!mine(c)) h += `<div class="pad" style="padding-bottom:0"><div class="note info" style="margin-top:0">This course is assigned to another reviewer. You can view it but not change it.</div></div>`;
  h += `<div class="pad" style="padding-top:4px"><div class="note err" id="val" style="display:none"></div>`;
  sections().forEach(sec => {
    h += `<div class="sec">${esc(sec.name)}</div>${sec.note ? `<div class="secnote">${esc(sec.note)}</div>` : ''}`;
    sec.items.forEach(({ r, n }) => {
      const v = item(c, r.id), cls = v.rating || (edit ? 'need' : '');
      h += `<div class="ri ${cls}" id="ri-${esc(r.id)}"><div class="rih"><div class="num">${n}</div>
        <div class="rtx"><b>${esc(r.criterion)}</b><div class="g">${esc(r.guidance)}</div>
          ${r.syllabusFields ? (edit ? `<div class="syl"><div><label class="f" for="st-${esc(r.id)}">Semester / term on syllabus</label><input type="text" id="st-${esc(r.id)}" data-in="sylTerm" data-item="${esc(r.id)}" value="${esc(v.sylTerm)}" placeholder="e.g. ${esc(S.term)}"></div>
            <div><label class="f" for="sd-${esc(r.id)}">Date last updated</label><input type="date" id="sd-${esc(r.id)}" data-in="sylDate" data-item="${esc(r.id)}" value="${esc(v.sylDate)}"></div></div>`
            : (v.sylTerm || v.sylDate ? `<div class="g">Syllabus term: ${esc(v.sylTerm || '—')} · Last updated: ${esc(v.sylDate || '—')}</div>` : '')) : ''}</div>
        ${edit ? `<div class="rg" role="radiogroup" aria-label="Rating for item ${n}">${['met', 'nm', 'na'].map(x => `<label class="${x}"><input type="radio" name="r-${esc(r.id)}" value="${x}" data-ch="rate" data-item="${esc(r.id)}"${v.rating === x ? ' checked' : ''}>${RLABEL[x]}</label>`).join('')}</div>`
               : `<span class="rated ${v.rating}">${RLABEL[v.rating] || 'Not rated'}</span>`}</div>
        ${edit ? `<div class="fb" id="fb-${esc(r.id)}"${v.rating === 'nm' || v.rating === 'met' ? '' : ' hidden'}><label class="small muted" for="ft-${esc(r.id)}" id="fl-${esc(r.id)}">${fbLabel(v.rating)}</label>
            <textarea id="ft-${esc(r.id)}" data-in="fb" data-item="${esc(r.id)}" placeholder="State the specific steps the instructor must take.">${esc(v.feedback)}</textarea></div>`
               : (v.feedback ? `<div class="fb"><span class="small muted">${v.rating === 'nm' ? 'Recommendation' : 'Comment'}:</span> ${esc(v.feedback)}</div>` : '')}</div>`;
    });
  });
  h += `</div>`;
  if (edit) h += `<div class="sum"><span class="chip met">Met: <b id="k-met">${k.met}</b></span><span class="chip nm">Not Met: <b id="k-nm">${k.nm}</b></span>
      <span class="chip na">N/A: <b id="k-na">${k.na}</b></span><span class="chip pe">Unrated: <b id="k-pend">${k.pend}</b></span>
      <span style="margin-left:auto;display:flex;gap:8px;align-items:center"><label class="small muted" for="rv-date">Review date</label><input type="date" id="rv-date" value="${today()}">
      <button class="btn g" data-act="submit">Submit review</button></span></div>`;
  if (sup) h += supPanel(c);
  app().innerHTML = h; window.scrollTo(0, 0);
}
const fbLabel = r => r === 'nm' ? 'Recommendation for the instructor (required for Not Met)' : 'Comment (optional)';
function outcomePanel(c) {
  const st = stageOf(c), rem = remOf(c), cert = st === 'Certified', me = mine(c);
  let h = `<div class="panel"><h3>Outcome and follow-up</h3><div class="body">
    <div class="note ${cert ? 'ok' : 'err'}" style="margin-top:0"><b>${cert ? 'CERTIFIED' : 'ACTION REQUIRED'}</b> · Reviewed ${esc(c['Review Date'])}${c['Certified Date'] ? ' · Certified ' + esc(c['Certified Date']) : ''}
      ${cert && c.Override === 'APPROVED' && openItems(c).length ? ' · by supervisor override with ' + openItems(c).length + ' item(s) still open' : ''}</div>`;
  if (rem.length) {
    h += `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0">${c['Feedback Sent']
        ? `<span><b>Feedback sent to instructor:</b> ${esc(c['Feedback Sent'])}</span>${me ? '<button class="btn sm" data-act="fbClear">Clear</button>' : ''}`
        : (me ? `<label class="small muted" for="fb-date">Feedback sent to instructor on</label><input type="date" id="fb-date" value="${today()}"><button class="btn p sm" data-act="fbSent">Record feedback sent</button>` : '<span class="muted">Feedback not yet sent to instructor.</span>')}</div>
      <div class="small muted" style="margin-bottom:6px">Record below whether the instructor has completed each required action. The course is certified when every item is completed.</div>`;
    rem.forEach(m => {
      const done = m.Status === 'Completed', n = S.rubric.findIndex(r => r.id === m['Item ID']) + 1, late = !done && m['Due Date'] && m['Due Date'] < today();
      h += `<div class="rem ${done ? 'done' : ''}"><div class="top"><div style="flex:1;min-width:220px"><b>${n ? 'Item ' + n + ': ' : ''}${esc(m.Criterion)}</b>
          <div style="margin-top:3px"><span class="muted">Required action:</span> ${esc(m['Required Action'])}</div></div>
          <div class="small" style="text-align:right">${done ? `<b style="color:var(--met-tx)">Completed</b><br>${esc(m['Closed By'])} · ${esc(m['Closed Date'])}` : `<b class="${late ? 'over' : ''}">Open${late ? ' — past due' : ''}</b><br>Due ${esc(m['Due Date'] || '—')}`}</div></div>
        ${me ? `<label class="small muted" for="rn-${esc(m['Item ID'])}" style="display:block;margin-top:6px">Coordinator note</label><textarea id="rn-${esc(m['Item ID'])}" placeholder="What was verified, and where.">${esc(m['Coordinator Note'])}</textarea>
          <div class="acts">${done ? `<button class="btn sm" data-act="remOpen" data-item="${esc(m['Item ID'])}">Reopen item</button>` : `<button class="btn g sm" data-act="remDone" data-item="${esc(m['Item ID'])}">Mark completed</button>
            <label class="small muted" for="rd-${esc(m['Item ID'])}">Due</label><input type="date" id="rd-${esc(m['Item ID'])}" value="${esc(m['Due Date'])}">`}
            <button class="btn sm" data-act="remNote" data-item="${esc(m['Item ID'])}">Save note${done ? '' : ' and due date'}</button></div>`
           : (m['Coordinator Note'] ? `<div class="small" style="margin-top:6px"><span class="muted">Coordinator note:</span> ${esc(m['Coordinator Note'])}</div>` : '')}</div>`;
    });
  }
  const canReopen = isSup() || (c.Reviewer === S.user.name && st === 'Action Required');
  h += `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn p sm" data-act="pdf">Export feedback report (PDF)</button>
    ${canReopen ? '<button class="btn sm" data-act="reopen">Reopen review to change ratings</button>' : ''}</div></div></div>`;
  return h;
}
function supPanel(c) {
  const revs = S.reviewers.filter(r => r.active);
  return `<div class="panel"><h3>Supervisor actions</h3><div class="body supbar">
    <div><label class="f" for="sp-rev">Reviewer</label><select id="sp-rev" data-ch="spField" data-k="Reviewer"><option value="">Unassigned</option>${revs.map(r => `<option${c.Reviewer === r.name ? ' selected' : ''}>${esc(r.name)}</option>`).join('')}</select></div>
    <div><label class="f" for="sp-pri">Priority</label><select id="sp-pri" data-ch="spField" data-k="Priority">${['P1', 'P2', 'P3'].map(p => `<option value="${p}"${(c.Priority || 'P2') === p ? ' selected' : ''}>${priLabel(p)}</option>`).join('')}</select></div>
    <div><label class="f" for="sp-ov">Outcome override</label><select id="sp-ov" data-ch="spField" data-k="Override"${submitted(c) ? '' : ' disabled title="Available after the review is submitted"'}>
      <option value="">None — follow the review</option><option value="APPROVED"${c.Override === 'APPROVED' ? ' selected' : ''}>Certify (APPROVED)</option><option value="ACTION REQUIRED"${c.Override === 'ACTION REQUIRED' ? ' selected' : ''}>Hold (ACTION REQUIRED)</option></select></div>
    <button class="btn sm" data-act="flag">${c.Flag ? 'Remove flag' : '⚑ Flag for follow-up'}</button>
    ${counts(c).pend === S.rubric.length && !submitted(c) ? '<button class="btn sm o" data-act="remove">Remove course</button>' : ''}
    <div style="flex-basis:100%"><label class="f" for="sp-notes">Supervisor notes</label><div style="display:flex;gap:8px"><input type="text" id="sp-notes" value="${esc(c.Notes)}" style="flex:1"><button class="btn sm" data-act="saveNotes">Save</button></div></div>
  </div></div>`;
}
function updateItemDom(c, id) {
  const v = item(c, id), ri = $('#ri-' + CSS.escape(id)); if (!ri) return;
  ri.className = 'ri ' + (v.rating || 'need');
  const fb = $('#fb-' + CSS.escape(id)); fb.hidden = !(v.rating === 'nm' || v.rating === 'met');
  $('#fl-' + CSS.escape(id)).textContent = fbLabel(v.rating);
  const k = counts(c); ['met', 'nm', 'na', 'pend'].forEach(x => { const e = $('#k-' + x); if (e) e.textContent = k[x]; });
}
function validate(c) {
  const un = [], nf = [];
  S.rubric.forEach((r, i) => { const v = item(c, r.id); if (!v.rating) un.push({ n: i + 1, id: r.id }); else if (v.rating === 'nm' && !v.feedback.trim()) nf.push({ n: i + 1, id: r.id }); });
  const box = $('#val');
  if (!un.length && !nf.length) { box.style.display = 'none'; return true; }

  box.style.display = 'block';
